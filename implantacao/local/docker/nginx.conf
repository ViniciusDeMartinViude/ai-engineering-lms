server {
    listen ${MOODLE_PORT};
    server_name _;
    root /srv/moodle/public;
    index index.php;
    client_max_body_size 110m;
    location / { try_files $uri $uri/ /r.php$is_args$args; }
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $saved_path $fastcgi_path_info;
        try_files $fastcgi_script_name /r.php$is_args$args;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $saved_path;
        fastcgi_pass moodle:9000;
    }
}
