x-app: &app
  build:
    context: ./docker
    target: app
  image: ai-engineering-moodle-local:5.3.1
  env_file: ./.secrets/moodle.env
  environment:
    MOODLE_URL: http://localhost:${MOODLE_PORT:-9090}
  volumes:
    - moodledata:/srv/moodledata
  depends_on:
    db:
      condition: service_healthy
services:
  moodle:
    <<: *app
  cron:
    <<: *app
    user: www-data
    command: ["sh", "-c", "while :; do php admin/cli/cron.php; sleep 60; done"]
  web:
    build:
      context: ./docker
      target: web
    environment:
      MOODLE_PORT: "${MOODLE_PORT:-9090}"
      NGINX_ENVSUBST_FILTER: "^MOODLE_PORT$"
    ports:
      - "127.0.0.1:${MOODLE_PORT:-9090}:${MOODLE_PORT:-9090}"
    depends_on:
      - moodle
volumes:
  moodledata:
