services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moodle"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
volumes:
  pgdata:
